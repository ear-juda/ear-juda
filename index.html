<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이어주다</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      color: white;
      background-image: url('handshake.jpg'); /* 배경 이미지 */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    header {
      text-align: center;
      padding: 100px 20px 50px;
      background-color: rgba(0,0,0,0.5);
    }
    header h1 { font-size: 3em; margin: 0; }
    header p { font-size: 1.2em; margin-top: 10px; }
    nav {
      display: flex;
      justify-content: center;
      background: rgba(0,0,0,0.7);
    }
    nav a { margin: 0 15px; padding: 15px; text-decoration: none; color: white; font-weight: bold; }
    nav a:hover { color: #FFD700; }
    section { padding: 60px 20px; text-align: center; background-color: rgba(0,0,0,0.5); margin: 0 10px 30px; border-radius: 10px; }
    section h2 { font-size: 2em; margin-bottom: 20px; }
    section p { max-width: 600px; margin: 0 auto 30px; line-height: 1.6; }
    .button { display: inline-block; padding: 12px 30px; background: #FFD700; color: black; text-decoration: none; border-radius: 5px; font-weight: bold; }
    .button:hover { background: #FFC107; }
    footer { text-align: center; padding: 30px 20px; font-size: 0.9em; background: rgba(0,0,0,0.7); }
    @media (max-width: 600px) {
      header { padding: 60px 20px 30px; }
      header h1 { font-size: 2em; }
      section { margin: 0 5px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>이어주다</h1>
    <p>고객과 함께 성장하는 믿음직한 파트너</p>
  </header>
  <nav>
    <a href="#about">회사소개</a>
    <a href="#products">방향성</a>
    <a href="#contact">연락처</a>
  </nav>
  <section id="about">
    <h2>회사소개</h2>
    <p>이어주다는 선도적인 브랜드와 개성있는 인플루언서를 매칭하는 마케팅 파트너사입니다. 
우리는 창의적인 아이디어를 가진 크리에이터를 발굴하고, 그들이 브랜드의 가치를 효과적으로 알릴 수 있도록 지원합니다.</p>
    <a class="button" href="#contact">문의하기</a>
  </section>
  <section id="products">
    <h2>방향성</h2>
    <p>이어주다는 캠페인 진행 전 명확한 기준을 통해 브랜드와 인플루언서를 분석하고 매칭하여 브랜드의 경쟁력을 강화합니다. All rights reserved.
  </footer>
</body>
</html>
