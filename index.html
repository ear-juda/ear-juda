<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 벤더사</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      color: white;
      background-image: url('handshake.jpg'); /* 배경 이미지 */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    header {
      text-align: center;
      padding: 100px 20px 50px;
      background-color: rgba(0,0,0,0.5);
    }
    header h1 { font-size: 3em; margin: 0; }
    header p { font-size: 1.2em; margin-top: 10px; }
    nav {
      display: flex;
      justify-content: center;
      background: rgba(0,0,0,0.7);
    }
    nav a { margin: 0 15px; padding: 15px; text-decoration: none; color: white; font-weight: bold; }
    nav a:hover { color: #FFD700; }
    section { padding: 60px 20px; text-align: center; background-color: rgba(0,0,0,0.5); margin: 0 10px 30px; border-radius: 10px; }
    section h2 { font-size: 2em; margin-bottom: 20px; }
    section p { max-width: 600px; margin: 0 auto 30px; line-height: 1.6; }
    .button { display: inline-block; padding: 12px 30px; background: #FFD700; color: black; text-decoration: none; border-radius: 5px; font-weight: bold; }
    .button:hover { background: #FFC107; }
    footer { text-align: center; padding: 30px 20px; font-size: 0.9em; background: rgba(0,0,0,0.7); }
    @media (max-width: 600px) {
      header { padding: 60px 20px 30px; }
      header h1 { font-size: 2em; }
      section { margin: 0 5px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>우리 벤더사</h1>
    <p>고객과 함께 성장하는 믿음직한 파트너</p>
  </header>
  <nav>
    <a href="#about">회사소개</a>
    <a href="#products">제품</a>
    <a href="#contact">연락처</a>
  </nav>
  <section id="about">
    <h2>회사소개</h2>
    <p>우리 벤더사는 최고의 품질과 서비스를 제공합니다. 신뢰할 수 있는 파트너로서 함께 성장해 나가겠습니다.</p>
    <a class="button" href="#contact">문의하기</a>
  </section>
  <section id="products">
    <h2>주요 제품</h2>
    <p>다양한 제품군을 보유하고 있으며, 고객 요구에 맞춘 맞춤형 솔루션을 제공합니다.</p>
    <a class="button" href="#contact">제품 문의</a>
  </section>
  <section id="contact">
    <h2>연락처</h2>
    <p>이메일: contact@vendor.com</p>
    <p>전화: 010-1234-5678</p>
    <p>주소: 서울특별시 강남구 테헤란로 123</p>
    <a class="button" href="mailto:contact@vendor.com">메일 보내기</a>
  </section>
  <footer>
    &copy; 2025 우리 벤더사. All rights reserved.
  </footer>
</body>
</html>
